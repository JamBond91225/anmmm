workflows:
  anmmm-release:
    name: ANMMM Release Build
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Upgrade Android Embedding
        script: flutter pub get && flutter create .
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
